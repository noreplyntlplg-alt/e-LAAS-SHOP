<style>
/* =========================================================
   SHOP-LAAS
   style.html
   ระบบบริหารจัดการร้านค้า
   Theme: Navy / Blue / Gray
   Responsive: Desktop / Tablet / Mobile
   ========================================================= */

/* =========================================================
   1. RESET
   ========================================================= */

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    background: #f3f6fa;
    color: #1f2937;
    font-family:
        "Noto Sans Thai",
        "Noto Sans",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

a {
    color: inherit;
    text-decoration: none;
}

img {
    max-width: 100%;
    display: block;
}

table {
    border-collapse: collapse;
    border-spacing: 0;
}

ul,
ol {
    margin: 0;
    padding: 0;
}

p,
h1,
h2,
h3,
h4,
h5,
h6 {
    margin-top: 0;
}

/* =========================================================
   2. CSS VARIABLES
   ========================================================= */

:root {
    --primary: #123c69;
    --primary-dark: #0b2948;
    --primary-light: #1d5d95;
    --primary-soft: #e8f1f9;

    --secondary: #2d6fa3;
    --secondary-light: #4f8fbd;

    --accent: #1f7a8c;
    --accent-light: #dff3f6;

    --success: #198754;
    --success-light: #e7f6ed;

    --warning: #d98b00;
    --warning-light: #fff4d6;

    --danger: #c0392b;
    --danger-light: #fdeceb;

    --info: #2471a3;
    --info-light: #e8f4fb;

    --text: #1f2937;
    --text-dark: #111827;
    --text-muted: #6b7280;
    --text-light: #9ca3af;

    --background: #f3f6fa;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --surface-dark: #e8edf3;

    --border: #d8e0e8;
    --border-dark: #c2ccd7;

    --sidebar-width: 265px;
    --sidebar-collapsed-width: 78px;
    --header-height: 68px;

    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;

    --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.07);
    --shadow-md: 0 5px 15px rgba(15, 23, 42, 0.09);
    --shadow-lg: 0 12px 30px rgba(15, 23, 42, 0.13);

    --transition-fast: 0.15s ease;
    --transition-normal: 0.25s ease;
}

/* =========================================================
   3. SCROLLBAR
   ========================================================= */

::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: #edf1f5;
}

::-webkit-scrollbar-thumb {
    background: #b8c3cf;
    border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
    background: #8f9dad;
}

/* =========================================================
   4. LOGIN PAGE
   ========================================================= */

.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
        linear-gradient(
            135deg,
            #0b2948 0%,
            #123c69 45%,
            #1d5d95 100%
        );
    position: relative;
    overflow: hidden;
}

.login-page::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    top: -220px;
    right: -120px;
}

.login-page::after {
    content: "";
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.04);
    bottom: -200px;
    left: -120px;
}

.login-container {
    width: 100%;
    max-width: 430px;
    position: relative;
    z-index: 2;
}

.login-card {
    background: rgba(255, 255, 255, 0.98);
    border-radius: 18px;
    padding: 36px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.22);
}

.login-logo {
    width: 78px;
    height: 78px;
    margin: 0 auto 20px;
    border-radius: 16px;
    background: var(--primary);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 800;
    box-shadow: var(--shadow-md);
}

.login-title {
    text-align: center;
    color: var(--primary-dark);
    font-size: 25px;
    font-weight: 800;
    margin-bottom: 6px;
}

.login-subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 28px;
}

.login-form .form-group {
    margin-bottom: 18px;
}

.login-footer {
    text-align: center;
    color: var(--text-light);
    font-size: 12px;
    margin-top: 22px;
}

/* =========================================================
   5. APPLICATION LAYOUT
   ========================================================= */

.app {
    min-height: 100vh;
    display: flex;
    background: var(--background);
}

.app.hidden,
.page.hidden,
.login-page.hidden {
    display: none !important;
}

/* =========================================================
   6. SIDEBAR
   ========================================================= */

.sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    z-index: 1000;
    background: var(--primary-dark);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    transition:
        width var(--transition-normal),
        transform var(--transition-normal);
    overflow: hidden;
}

.sidebar-header {
    height: var(--header-height);
    min-height: var(--header-height);
    padding: 0 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.sidebar-logo {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 9px;
    background: #ffffff;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 17px;
}

.sidebar-brand {
    min-width: 0;
    overflow: hidden;
}

.sidebar-brand-title {
    font-size: 16px;
    line-height: 1.2;
    font-weight: 800;
    white-space: nowrap;
}

.sidebar-brand-subtitle {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.62);
    margin-top: 2px;
    white-space: nowrap;
}

.sidebar-menu {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px 10px 20px;
}

.sidebar-section-title {
    padding: 10px 12px 6px;
    color: rgba(255, 255, 255, 0.42);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.sidebar-item {
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    margin-bottom: 3px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: rgba(255, 255, 255, 0.76);
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    font-size: 13px;
    font-weight: 500;
    transition:
        background var(--transition-fast),
        color var(--transition-fast);
}

.sidebar-item:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #ffffff;
}

.sidebar-item.active {
    background: #ffffff;
    color: var(--primary);
    font-weight: 700;
}

.sidebar-item-icon {
    width: 22px;
    min-width: 22px;
    text-align: center;
    font-size: 16px;
}

.sidebar-item-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.sidebar-badge {
    margin-left: auto;
    min-width: 20px;
    padding: 2px 6px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.12);
    font-size: 10px;
    text-align: center;
}

.sidebar-item.active .sidebar-badge {
    background: var(--primary-soft);
    color: var(--primary);
}

.sidebar-footer {
    padding: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.sidebar-user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
}

.sidebar-user-avatar {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    background: #ffffff;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
}

.sidebar-user-info {
    min-width: 0;
    flex: 1;
}

.sidebar-user-name {
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.sidebar-user-role {
    color: rgba(255, 255, 255, 0.52);
    font-size: 10px;
}

/* =========================================================
   7. MAIN AREA
   ========================================================= */

.main-wrapper {
    width: calc(100% - var(--sidebar-width));
    margin-left: var(--sidebar-width);
    min-height: 100vh;
    transition:
        width var(--transition-normal),
        margin-left var(--transition-normal);
}

.topbar {
    width: 100%;
    height: var(--header-height);
    min-height: var(--header-height);
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 900;
}

.topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.sidebar-toggle {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--primary);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
}

.sidebar-toggle:hover {
    background: var(--primary-soft);
}

.topbar-title {
    color: var(--text-dark);
    font-size: 18px;
    font-weight: 800;
    white-space: nowrap;
}

.topbar-subtitle {
    color: var(--text-muted);
    font-size: 12px;
    margin-left: 8px;
}

.topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.topbar-button {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-muted);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-fast);
}

.topbar-button:hover {
    background: var(--surface-soft);
    color: var(--primary);
    border-color: var(--border-dark);
}

.content {
    padding: 24px;
}

/* =========================================================
   8. PAGE HEADER
   ========================================================= */

.page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 22px;
}

.page-header-left {
    min-width: 0;
}

.page-title {
    margin: 0;
    color: var(--text-dark);
    font-size: 22px;
    line-height: 1.3;
    font-weight: 800;
}

.page-description {
    margin: 5px 0 0;
    color: var(--text-muted);
    font-size: 13px;
}

.page-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

/* =========================================================
   9. CARDS
   ========================================================= */

.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
}

.card-header {
    min-height: 58px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
}

.card-title {
    margin: 0;
    color: var(--text-dark);
    font-size: 15px;
    font-weight: 800;
}

.card-subtitle {
    margin: 2px 0 0;
    color: var(--text-muted);
    font-size: 11px;
}

.card-body {
    padding: 18px;
}

.card-footer {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface-soft);
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}

/* =========================================================
   10. DASHBOARD STAT CARDS
   ========================================================= */

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 20px;
}

.stat-card {
    min-height: 128px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
    position: relative;
    overflow: hidden;
}

.stat-card::after {
    content: "";
    width: 80px;
    height: 80px;
    position: absolute;
    right: -25px;
    bottom: -25px;
    border-radius: 50%;
    background: rgba(18, 60, 105, 0.05);
}

.stat-card-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 18px;
    margin-bottom: 12px;
}

.stat-card.success .stat-card-icon {
    background: var(--success-light);
    color: var(--success);
}

.stat-card.warning .stat-card-icon {
    background: var(--warning-light);
    color: var(--warning);
}

.stat-card.danger .stat-card-icon {
    background: var(--danger-light);
    color: var(--danger);
}

.stat-card.info .stat-card-icon {
    background: var(--info-light);
    color: var(--info);
}

.stat-card-label {
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 4px;
}

.stat-card-value {
    color: var(--text-dark);
    font-size: 23px;
    font-weight: 800;
    line-height: 1.25;
}

.stat-card-meta {
    color: var(--text-light);
    font-size: 10px;
    margin-top: 5px;
}

/* =========================================================
   11. DASHBOARD GRID
   ========================================================= */

.dashboard-grid {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
    gap: 18px;
}

.dashboard-grid-full {
    grid-column: 1 / -1;
}

.dashboard-two-column {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

/* =========================================================
   12. BUTTONS
   ========================================================= */

.btn {
    min-height: 38px;
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 8px 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.2;
    transition:
        background var(--transition-fast),
        border-color var(--transition-fast),
        color var(--transition-fast),
        box-shadow var(--transition-fast),
        transform var(--transition-fast);
    white-space: nowrap;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn:active {
    transform: translateY(0);
}

.btn:disabled {
    cursor: not-allowed;
    opacity: 0.55;
    transform: none;
}

.btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #ffffff;
}

.btn-primary:hover {
    background: var(--primary-dark);
    border-color: var(--primary-dark);
}

.btn-secondary {
    background: #ffffff;
    border-color: var(--border-dark);
    color: var(--text);
}

.btn-secondary:hover {
    background: var(--surface-soft);
}

.btn-success {
    background: var(--success);
    border-color: var(--success);
    color: #ffffff;
}

.btn-success:hover {
    background: #146c43;
    border-color: #146c43;
}

.btn-warning {
    background: var(--warning);
    border-color: var(--warning);
    color: #ffffff;
}

.btn-warning:hover {
    background: #b97400;
    border-color: #b97400;
}

.btn-danger {
    background: var(--danger);
    border-color: var(--danger);
    color: #ffffff;
}

.btn-danger:hover {
    background: #a93226;
    border-color: #a93226;
}

.btn-info {
    background: var(--info);
    border-color: var(--info);
    color: #ffffff;
}

.btn-info:hover {
    background: #1c5b82;
    border-color: #1c5b82;
}

.btn-light {
    background: var(--surface-soft);
    border-color: var(--border);
    color: var(--text);
}

.btn-light:hover {
    background: #eef2f6;
}

.btn-outline-primary {
    background: #ffffff;
    border-color: var(--primary);
    color: var(--primary);
}

.btn-outline-primary:hover {
    background: var(--primary);
    color: #ffffff;
}

.btn-outline-danger {
    background: #ffffff;
    border-color: var(--danger);
    color: var(--danger);
}

.btn-outline-danger:hover {
    background: var(--danger);
    color: #ffffff;
}

.btn-sm {
    min-height: 32px;
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 6px;
}

.btn-lg {
    min-height: 46px;
    padding: 10px 18px;
    font-size: 14px;
    border-radius: 8px;
}

.btn-block {
    width: 100%;
}

/* =========================================================
   13. FORMS
   ========================================================= */

.form-group {
    margin-bottom: 15px;
}

.form-label {
    display: block;
    margin-bottom: 6px;
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
}

.form-label.required::after {
    content: " *";
    color: var(--danger);
}

.form-control,
.form-select,
.form-textarea {
    width: 100%;
    min-height: 40px;
    border: 1px solid var(--border-dark);
    border-radius: 7px;
    background: #ffffff;
    color: var(--text);
    padding: 9px 11px;
    font-size: 13px;
    outline: none;
    transition:
        border-color var(--transition-fast),
        box-shadow var(--transition-fast),
        background var(--transition-fast);
}

.form-control::placeholder,
.form-textarea::placeholder {
    color: #a5adb7;
}

.form-control:hover,
.form-select:hover,
.form-textarea:hover {
    border-color: #aab7c5;
}

.form-control:focus,
.form-select:focus,
.form-textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(18, 60, 105, 0.10);
}

.form-control:disabled,
.form-select:disabled,
.form-textarea:disabled {
    background: #eef2f5;
    color: var(--text-muted);
    cursor: not-allowed;
}

.form-textarea {
    min-height: 100px;
    resize: vertical;
}

.form-help {
    margin-top: 5px;
    color: var(--text-muted);
    font-size: 11px;
}

.form-error {
    margin-top: 5px;
    color: var(--danger);
    font-size: 11px;
}

.form-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

.form-row-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
}

.form-row-4 {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
}

/* =========================================================
   14. INPUT GROUP
   ========================================================= */

.input-group {
    display: flex;
    align-items: stretch;
    width: 100%;
}

.input-group .form-control {
    flex: 1;
    min-width: 0;
}

.input-group-text {
    min-width: 40px;
    padding: 8px 11px;
    border: 1px solid var(--border-dark);
    background: var(--surface-soft);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
}

.input-group > .input-group-text:first-child {
    border-radius: 7px 0 0 7px;
    border-right: 0;
}

.input-group > .form-control:not(:last-child) {
    border-radius: 0;
}

.input-group > .input-group-text:last-child {
    border-radius: 0 7px 7px 0;
    border-left: 0;
}

/* =========================================================
   15. SEARCH BAR
   ========================================================= */

.search-box {
    position: relative;
    width: 100%;
    max-width: 330px;
}

.search-box .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    pointer-events: none;
}

.search-box .form-control {
    padding-left: 34px;
}

/* =========================================================
   16. TABLE
   ========================================================= */

.table-container {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
}

.data-table {
    width: 100%;
    min-width: 720px;
    background: #ffffff;
}

.data-table thead th {
    background: #eef3f8;
    color: #344054;
    border-bottom: 1px solid var(--border-dark);
    padding: 11px 12px;
    font-size: 11px;
    font-weight: 800;
    text-align: left;
    white-space: nowrap;
}

.data-table tbody td {
    padding: 11px 12px;
    border-bottom: 1px solid #edf0f3;
    color: var(--text);
    font-size: 12px;
    vertical-align: middle;
}

.data-table tbody tr:last-child td {
    border-bottom: 0;
}

.data-table tbody tr:hover {
    background: #f8fafc;
}

.data-table .text-right {
    text-align: right;
}

.data-table .text-center {
    text-align: center;
}

.data-table .nowrap {
    white-space: nowrap;
}

.table-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
}

.table-empty-icon {
    font-size: 32px;
    margin-bottom: 8px;
    opacity: 0.55;
}

.table-loading {
    padding: 30px;
    text-align: center;
    color: var(--text-muted);
}

/* =========================================================
   17. TABLE ACTIONS
   ========================================================= */

.table-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 5px;
}

.action-button {
    width: 30px;
    height: 30px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: #ffffff;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: all var(--transition-fast);
}

.action-button:hover {
    background: var(--surface-soft);
    color: var(--primary);
    border-color: var(--primary);
}

.action-button.edit:hover {
    color: var(--info);
    border-color: var(--info);
}

.action-button.delete:hover {
    color: var(--danger);
    border-color: var(--danger);
}

/* =========================================================
   18. BADGES
   ========================================================= */

.badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 22px;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
}

.badge-primary {
    color: var(--primary);
    background: var(--primary-soft);
}

.badge-success {
    color: #146c43;
    background: var(--success-light);
}

.badge-warning {
    color: #946200;
    background: var(--warning-light);
}

.badge-danger {
    color: #a93226;
    background: var(--danger-light);
}

.badge-info {
    color: #1c5b82;
    background: var(--info-light);
}

.badge-secondary {
    color: #4b5563;
    background: #eef0f3;
}

/* =========================================================
   19. ALERTS
   ========================================================= */

.alert {
    padding: 12px 14px;
    border: 1px solid transparent;
    border-radius: 8px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 15px;
    font-size: 12px;
}

.alert-icon {
    margin-top: 1px;
    font-size: 15px;
}

.alert-content {
    flex: 1;
    min-width: 0;
}

.alert-title {
    font-weight: 800;
    margin-bottom: 2px;
}

.alert-primary {
    background: var(--primary-soft);
    border-color: #cbddec;
    color: var(--primary-dark);
}

.alert-success {
    background: var(--success-light);
    border-color: #c5e7d3;
    color: #146c43;
}

.alert-warning {
    background: var(--warning-light);
    border-color: #f2d79a;
    color: #805700;
}

.alert-danger {
    background: var(--danger-light);
    border-color: #efc7c3;
    color: #922b21;
}

.alert-info {
    background: var(--info-light);
    border-color: #c9e1ef;
    color: #1c5b82;
}

/* =========================================================
   20. MODAL
   ========================================================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 5000;
    background: rgba(15, 23, 42, 0.52);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 1;
    visibility: visible;
    transition:
        opacity var(--transition-normal),
        visibility var(--transition-normal);
}

.modal-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.modal {
    width: 100%;
    max-width: 650px;
    max-height: calc(100vh - 40px);
    background: #ffffff;
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(0);
    transition: transform var(--transition-normal);
}

.modal-lg {
    max-width: 900px;
}

.modal-xl {
    max-width: 1200px;
}

.modal-sm {
    max-width: 420px;
}

.modal-header {
    min-height: 58px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.modal-title {
    margin: 0;
    color: var(--text-dark);
    font-size: 16px;
    font-weight: 800;
}

.modal-close {
    width: 32px;
    height: 32px;
    border: 0;
    background: transparent;
    color: var(--text-muted);
    border-radius: 6px;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-close:hover {
    background: var(--surface-dark);
    color: var(--text-dark);
}

.modal-body {
    padding: 18px;
    overflow-y: auto;
}

.modal-footer {
    padding: 13px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface-soft);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
}

/* =========================================================
   21. TOAST
   ========================================================= */

.toast-container {
    position: fixed;
    top: 82px;
    right: 20px;
    z-index: 7000;
    width: min(380px, calc(100vw - 40px));
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toast {
    background: #ffffff;
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    animation: toast-in 0.25s ease forwards;
}

.toast.success {
    border-left-color: var(--success);
}

.toast.warning {
    border-left-color: var(--warning);
}

.toast.danger {
    border-left-color: var(--danger);
}

.toast.info {
    border-left-color: var(--info);
}

.toast-icon {
    font-size: 16px;
    margin-top: 1px;
}

.toast-content {
    flex: 1;
    min-width: 0;
}

.toast-title {
    color: var(--text-dark);
    font-weight: 800;
    font-size: 12px;
}

.toast-message {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 2px;
}

.toast-close {
    width: 22px;
    height: 22px;
    border: 0;
    background: transparent;
    color: var(--text-light);
    display: flex;
    align-items: center;
    justify-content: center;
}

@keyframes toast-in {
    from {
        opacity: 0;
        transform: translateX(30px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes toast-out {
    from {
        opacity: 1;
        transform: translateX(0);
    }

    to {
        opacity: 0;
        transform: translateX(30px);
    }
}

/* =========================================================
   22. LOADING OVERLAY
   ========================================================= */

.loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 8000;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
}

.loading-overlay.hidden {
    display: none;
}

.loading-spinner {
    width: 42px;
    height: 42px;
    border: 4px solid #dbe4ed;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

.loading-text {
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   23. INLINE SPINNER
   ========================================================= */

.spinner {
    width: 17px;
    height: 17px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
}

.spinner-dark {
    border-color: rgba(18, 60, 105, 0.20);
    border-top-color: var(--primary);
}

/* =========================================================
   24. SALE / PURCHASE CART
   ========================================================= */

.document-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 350px;
    gap: 18px;
    align-items: start;
}

.document-main {
    min-width: 0;
}

.document-summary {
    position: sticky;
    top: 88px;
}

.document-items {
    min-height: 160px;
}

.cart-table {
    width: 100%;
    min-width: 800px;
}

.cart-table th {
    background: #eef3f8;
    color: #344054;
    padding: 10px;
    font-size: 11px;
    font-weight: 800;
    text-align: left;
    border-bottom: 1px solid var(--border-dark);
}

.cart-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #edf0f3;
    vertical-align: middle;
}

.cart-product-name {
    font-weight: 700;
    color: var(--text-dark);
}

.cart-product-code {
    color: var(--text-light);
    font-size: 10px;
    margin-top: 2px;
}

.cart-qty-input {
    width: 75px;
    text-align: center;
}

.cart-price-input {
    width: 105px;
    text-align: right;
}

.cart-discount-input {
    width: 90px;
    text-align: right;
}

.cart-remove {
    width: 30px;
    height: 30px;
    border: 1px solid #efc7c3;
    border-radius: 5px;
    background: var(--danger-light);
    color: var(--danger);
    display: flex;
    align-items: center;
    justify-content: center;
}

.cart-remove:hover {
    background: var(--danger);
    color: #ffffff;
}

.summary-list {
    width: 100%;
}

.summary-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    color: var(--text-muted);
    font-size: 12px;
}

.summary-row + .summary-row {
    border-top: 1px dashed #e4e8ed;
}

.summary-row.total {
    margin-top: 5px;
    padding-top: 13px;
    color: var(--text-dark);
    font-size: 16px;
    font-weight: 800;
}

.summary-value {
    text-align: right;
    color: var(--text-dark);
    font-weight: 700;
}

.summary-row.total .summary-value {
    color: var(--primary);
    font-size: 21px;
}

/* =========================================================
   25. PRODUCT SELECT
   ========================================================= */

.product-search-panel {
    padding: 14px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 14px;
}

.product-results {
    max-height: 280px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #ffffff;
}

.product-result-item {
    width: 100%;
    padding: 10px 12px;
    border: 0;
    border-bottom: 1px solid #edf0f3;
    background: #ffffff;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.product-result-item:last-child {
    border-bottom: 0;
}

.product-result-item:hover {
    background: var(--primary-soft);
}

.product-result-main {
    min-width: 0;
}

.product-result-name {
    color: var(--text-dark);
    font-weight: 700;
    font-size: 12px;
}

.product-result-code {
    color: var(--text-muted);
    font-size: 10px;
    margin-top: 2px;
}

.product-result-price {
    color: var(--primary);
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
}

/* =========================================================
   26. FILTER BAR
   ========================================================= */

.filter-bar {
    padding: 13px;
    margin-bottom: 15px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex-wrap: wrap;
}

.filter-item {
    min-width: 150px;
}

.filter-item.wide {
    min-width: 240px;
    flex: 1;
}

.filter-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

/* =========================================================
   27. PAGINATION
   ========================================================= */

.pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 0 0;
}

.pagination-info {
    color: var(--text-muted);
    font-size: 11px;
}

.pagination-buttons {
    display: flex;
    align-items: center;
    gap: 4px;
}

.page-button {
    min-width: 32px;
    height: 32px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #ffffff;
    color: var(--text);
    font-size: 11px;
}

.page-button:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.page-button.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #ffffff;
}

.page-button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

/* =========================================================
   28. REPORT
   ========================================================= */

.report-header {
    padding: 18px;
    border: 1px solid var(--border);
    background: #ffffff;
    border-radius: 9px;
    margin-bottom: 15px;
}

.report-title {
    color: var(--text-dark);
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 3px;
}

.report-period {
    color: var(--text-muted);
    font-size: 11px;
}

.report-summary-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 15px;
}

.report-summary-box {
    padding: 14px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
}

.report-summary-label {
    color: var(--text-muted);
    font-size: 11px;
    margin-bottom: 5px;
}

.report-summary-value {
    color: var(--text-dark);
    font-size: 18px;
    font-weight: 800;
}

/* =========================================================
   29. CHART PLACEHOLDER
   ========================================================= */

.chart-container {
    width: 100%;
    min-height: 280px;
    position: relative;
}

.chart-wrapper {
    position: relative;
    width: 100%;
    height: 320px;
}

.chart-wrapper canvas {
    max-width: 100%;
}

/* =========================================================
   30. EMPTY STATE
   ========================================================= */

.empty-state {
    padding: 50px 20px;
    text-align: center;
}

.empty-state-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--surface-dark);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
}

.empty-state-title {
    color: var(--text-dark);
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 5px;
}

.empty-state-text {
    max-width: 420px;
    margin: 0 auto;
    color: var(--text-muted);
    font-size: 12px;
}

/* =========================================================
   31. PROFILE
   ========================================================= */

.profile-card {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 18px;
}

.profile-avatar {
    width: 64px;
    height: 64px;
    min-width: 64px;
    border-radius: 50%;
    background: var(--primary-soft);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
}

.profile-name {
    color: var(--text-dark);
    font-size: 17px;
    font-weight: 800;
}

.profile-role {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 2px;
}

/* =========================================================
   32. SETTINGS
   ========================================================= */

.settings-layout {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 18px;
}

.settings-menu {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    height: fit-content;
}

.settings-menu-item {
    width: 100%;
    padding: 10px 12px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    text-align: left;
    font-size: 12px;
    font-weight: 600;
}

.settings-menu-item:hover {
    background: var(--surface-soft);
    color: var(--primary);
}

.settings-menu-item.active {
    background: var(--primary-soft);
    color: var(--primary);
}

.settings-panel {
    min-width: 0;
}

/* =========================================================
   33. SYSTEM STATUS
   ========================================================= */

.system-status {
    display: flex;
    align-items: center;
    gap: 8px;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--text-light);
}

.status-dot.online {
    background: var(--success);
    box-shadow: 0 0 0 3px var(--success-light);
}

.status-dot.warning {
    background: var(--warning);
    box-shadow: 0 0 0 3px var(--warning-light);
}

.status-dot.offline {
    background: var(--danger);
    box-shadow: 0 0 0 3px var(--danger-light);
}

.status-text {
    font-size: 11px;
    color: var(--text-muted);
}

/* =========================================================
   34. STOCK STATUS
   ========================================================= */

.stock-normal {
    color: var(--success);
    font-weight: 700;
}

.stock-low {
    color: var(--warning);
    font-weight: 700;
}

.stock-out {
    color: var(--danger);
    font-weight: 800;
}

/* =========================================================
   35. MONEY
   ========================================================= */

.money {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}

.money-positive {
    color: var(--success);
}

.money-negative {
    color: var(--danger);
}

.money-primary {
    color: var(--primary);
    font-weight: 800;
}

/* =========================================================
   36. DOCUMENT NUMBER
   ========================================================= */

.document-number {
    font-family:
        "Cascadia Code",
        "Consolas",
        monospace;
    color: var(--primary);
    font-weight: 700;
    font-size: 12px;
}

/* =========================================================
   37. CHECKBOX / RADIO
   ========================================================= */

.checkbox-group,
.radio-group {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.checkbox-label,
.radio-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
}

.checkbox-label input,
.radio-label input {
    width: 16px;
    height: 16px;
    accent-color: var(--primary);
}

/* =========================================================
   38. SWITCH
   ========================================================= */

.switch {
    position: relative;
    width: 42px;
    height: 23px;
    display: inline-block;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.switch-slider {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: #cbd3dc;
    cursor: pointer;
    transition: background var(--transition-fast);
}

.switch-slider::before {
    content: "";
    position: absolute;
    width: 17px;
    height: 17px;
    left: 3px;
    top: 3px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: var(--shadow-xs);
    transition: transform var(--transition-fast);
}

.switch input:checked + .switch-slider {
    background: var(--primary);
}

.switch input:checked + .switch-slider::before {
    transform: translateX(19px);
}

/* =========================================================
   39. DIVIDERS
   ========================================================= */

.divider {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin: 18px 0;
}

.divider-text {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-muted);
    font-size: 11px;
}

.divider-text::before,
.divider-text::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
}

/* =========================================================
   40. UTILITY CLASSES
   ========================================================= */

.hidden {
    display: none !important;
}

.d-none {
    display: none !important;
}

.d-block {
    display: block !important;
}

.d-flex {
    display: flex !important;
}

.d-grid {
    display: grid !important;
}

.flex-1 {
    flex: 1;
}

.flex-wrap {
    flex-wrap: wrap;
}

.align-center {
    align-items: center;
}

.align-start {
    align-items: flex-start;
}

.align-end {
    align-items: flex-end;
}

.justify-between {
    justify-content: space-between;
}

.justify-center {
    justify-content: center;
}

.justify-end {
    justify-content: flex-end;
}

.gap-4 {
    gap: 4px;
}

.gap-6 {
    gap: 6px;
}

.gap-8 {
    gap: 8px;
}

.gap-10 {
    gap: 10px;
}

.gap-12 {
    gap: 12px;
}

.gap-16 {
    gap: 16px;
}

.gap-20 {
    gap: 20px;
}

.mt-0 {
    margin-top: 0 !important;
}

.mt-5 {
    margin-top: 5px !important;
}

.mt-10 {
    margin-top: 10px !important;
}

.mt-15 {
    margin-top: 15px !important;
}

.mt-20 {
    margin-top: 20px !important;
}

.mb-0 {
    margin-bottom: 0 !important;
}

.mb-5 {
    margin-bottom: 5px !important;
}

.mb-10 {
    margin-bottom: 10px !important;
}

.mb-15 {
    margin-bottom: 15px !important;
}

.mb-20 {
    margin-bottom: 20px !important;
}

.p-0 {
    padding: 0 !important;
}

.p-5 {
    padding: 5px !important;
}

.p-10 {
    padding: 10px !important;
}

.p-15 {
    padding: 15px !important;
}

.p-20 {
    padding: 20px !important;
}

.text-left {
    text-align: left !important;
}

.text-center {
    text-align: center !important;
}

.text-right {
    text-align: right !important;
}

.text-primary {
    color: var(--primary) !important;
}

.text-success {
    color: var(--success) !important;
}

.text-warning {
    color: var(--warning) !important;
}

.text-danger {
    color: var(--danger) !important;
}

.text-muted {
    color: var(--text-muted) !important;
}

.text-dark {
    color: var(--text-dark) !important;
}

.fw-normal {
    font-weight: 400 !important;
}

.fw-medium {
    font-weight: 500 !important;
}

.fw-semibold {
    font-weight: 600 !important;
}

.fw-bold {
    font-weight: 700 !important;
}

.fw-extrabold {
    font-weight: 800 !important;
}

.w-100 {
    width: 100% !important;
}

.w-auto {
    width: auto !important;
}

.min-w-0 {
    min-width: 0 !important;
}

.overflow-hidden {
    overflow: hidden !important;
}

.overflow-auto {
    overflow: auto !important;
}

.rounded {
    border-radius: var(--radius-md) !important;
}

.shadow-none {
    box-shadow: none !important;
}

/* =========================================================
   41. RESPONSIVE - LARGE TABLET
   ========================================================= */

@media (max-width: 1200px) {
    :root {
        --sidebar-width: 230px;
    }

    .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .report-summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .document-layout {
        grid-template-columns: minmax(0, 1fr) 310px;
    }

    .dashboard-grid {
        grid-template-columns: minmax(0, 1fr);
    }

    .dashboard-two-column {
        grid-template-columns: minmax(0, 1fr);
    }
}

/* =========================================================
   42. RESPONSIVE - TABLET
   ========================================================= */

@media (max-width: 992px) {
    :root {
        --sidebar-width: 240px;
    }

    .sidebar {
        transform: translateX(-100%);
        box-shadow: var(--shadow-lg);
    }

    .sidebar.mobile-open {
        transform: translateX(0);
    }

    .main-wrapper {
        width: 100%;
        margin-left: 0;
    }

    .topbar {
        padding: 0 18px;
    }

    .content {
        padding: 18px;
    }

    .sidebar-overlay {
        position: fixed;
        inset: 0;
        z-index: 999;
        background: rgba(15, 23, 42, 0.45);
    }

    .document-layout {
        grid-template-columns: minmax(0, 1fr);
    }

    .document-summary {
        position: static;
    }

    .settings-layout {
        grid-template-columns: 1fr;
    }

    .settings-menu {
        display: flex;
        overflow-x: auto;
        gap: 4px;
    }

    .settings-menu-item {
        width: auto;
        white-space: nowrap;
    }
}

/* =========================================================
   43. RESPONSIVE - MOBILE
   ========================================================= */

@media (max-width: 768px) {
    body {
        font-size: 13px;
    }

    .topbar {
        height: 60px;
        min-height: 60px;
        padding: 0 12px;
    }

    .topbar-title {
        font-size: 15px;
    }

    .topbar-subtitle {
        display: none;
    }

    .topbar-right {
        gap: 4px;
    }

    .topbar-button {
        width: 34px;
        height: 34px;
    }

    .content {
        padding: 14px;
    }

    .page-header {
        flex-direction: column;
        margin-bottom: 16px;
    }

    .page-title {
        font-size: 19px;
    }

    .page-actions {
        width: 100%;
    }

    .page-actions .btn {
        flex: 1;
    }

    .stats-grid {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .stat-card {
        min-height: 110px;
    }

    .form-row,
    .form-row-3,
    .form-row-4 {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .dashboard-two-column {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .report-summary-grid {
        grid-template-columns: 1fr;
    }

    .card-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .card-header .page-actions,
    .card-header .search-box {
        width: 100%;
        max-width: none;
    }

    .filter-bar {
        align-items: stretch;
        flex-direction: column;
    }

    .filter-item,
    .filter-item.wide {
        width: 100%;
        min-width: 0;
    }

    .filter-actions {
        width: 100%;
    }

    .filter-actions .btn {
        flex: 1;
    }

    .modal-overlay {
        padding: 10px;
    }

    .modal {
        max-height: calc(100vh - 20px);
    }

    .modal-body {
        padding: 14px;
    }

    .modal-footer {
        padding: 10px 14px;
    }

    .login-card {
        padding: 26px 20px;
    }

    .login-page {
        padding: 14px;
    }

    .profile-card {
        align-items: flex-start;
    }
}

/* =========================================================
   44. RESPONSIVE - SMALL MOBILE
   ========================================================= */

@media (max-width: 480px) {
    .content {
        padding: 10px;
    }

    .topbar {
        padding: 0 8px;
    }

    .topbar-title {
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .sidebar-toggle {
        width: 34px;
        height: 34px;
    }

    .topbar-button {
        width: 32px;
        height: 32px;
    }

    .page-title {
        font-size: 18px;
    }

    .card-body {
        padding: 13px;
    }

    .card-header {
        padding: 12px 13px;
    }

    .card-footer {
        padding: 11px 13px;
    }

    .btn {
        min-height: 36px;
        padding: 7px 10px;
        font-size: 12px;
    }

    .btn-lg {
        min-height: 42px;
    }

    .login-logo {
        width: 68px;
        height: 68px;
        font-size: 28px;
    }

    .login-title {
        font-size: 21px;
    }

    .toast-container {
        top: 68px;
        right: 10px;
        width: calc(100vw - 20px);
    }
}

/* =========================================================
   45. PRINT
   ========================================================= */

@media print {
    body {
        background: #ffffff !important;
        color: #000000 !important;
    }

    .sidebar,
    .topbar,
    .page-actions,
    .filter-bar,
    .btn,
    .action-button,
    .toast-container,
    .modal-overlay,
    .loading-overlay {
        display: none !important;
    }

    .main-wrapper {
        width: 100% !important;
        margin-left: 0 !important;
    }

    .content {
        padding: 0 !important;
    }

    .card {
        border: 0 !important;
        box-shadow: none !important;
    }

    .table-container {
        overflow: visible !important;
        border: 1px solid #000 !important;
    }

    .data-table {
        min-width: 0 !important;
    }

    .data-table thead th,
    .data-table tbody td {
        color: #000000 !important;
        border-color: #000000 !important;
    }

    .data-table thead th {
        background: #eeeeee !important;
    }
}

/* =========================================================
   46. ACCESSIBILITY
   ========================================================= */

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline: 3px solid rgba(36, 113, 163, 0.28);
    outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
}

/* =========================================================
   47. SIDEBAR COLLAPSED DESKTOP
   ========================================================= */

.app.sidebar-collapsed .sidebar {
    width: var(--sidebar-collapsed-width);
    min-width: var(--sidebar-collapsed-width);
}

.app.sidebar-collapsed .main-wrapper {
    width: calc(100% - var(--sidebar-collapsed-width));
    margin-left: var(--sidebar-collapsed-width);
}

.app.sidebar-collapsed .sidebar-brand,
.app.sidebar-collapsed .sidebar-item-text,
.app.sidebar-collapsed .sidebar-badge,
.app.sidebar-collapsed .sidebar-section-title,
.app.sidebar-collapsed .sidebar-user-info {
    display: none;
}

.app.sidebar-collapsed .sidebar-header {
    justify-content: center;
    padding: 0;
}

.app.sidebar-collapsed .sidebar-item {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
}

.app.sidebar-collapsed .sidebar-user {
    justify-content: center;
}

@media (max-width: 992px) {
    .app.sidebar-collapsed .sidebar {
        width: var(--sidebar-width);
        min-width: var(--sidebar-width);
        transform: translateX(-100%);
    }

    .app.sidebar-collapsed .main-wrapper {
        width: 100%;
        margin-left: 0;
    }
}

/* =========================================================
   48. LOGIN ERROR
   ========================================================= */

.login-error {
    display: none;
    padding: 10px 12px;
    margin-bottom: 15px;
    border: 1px solid #efc7c3;
    border-radius: 7px;
    background: var(--danger-light);
    color: #922b21;
    font-size: 12px;
}

.login-error.show {
    display: block;
}

/* =========================================================
   49. PASSWORD FIELD
   ========================================================= */

.password-wrapper {
    position: relative;
}

.password-wrapper .form-control {
    padding-right: 42px;
}

.password-toggle {
    position: absolute;
    right: 7px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
}

.password-toggle:hover {
    background: var(--surface-dark);
    color: var(--primary);
}

/* =========================================================
   50. DROPDOWN
   ========================================================= */

.dropdown {
    position: relative;
}

.dropdown-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 7px);
    min-width: 190px;
    padding: 6px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow-md);
    z-index: 2000;
    display: none;
}

.dropdown-menu.show {
    display: block;
}

.dropdown-item {
    width: 100%;
    min-height: 34px;
    padding: 7px 10px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--text);
    text-align: left;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.dropdown-item:hover {
    background: var(--surface-soft);
    color: var(--primary);
}

.dropdown-divider {
    height: 1px;
    background: var(--border);
    margin: 5px 0;
}

/* =========================================================
   51. AUTOCOMPLETE
   ========================================================= */

.autocomplete {
    position: relative;
}

.autocomplete-list {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 2500;
    max-height: 260px;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 7px;
    box-shadow: var(--shadow-md);
    display: none;
}

.autocomplete-list.show {
    display: block;
}

.autocomplete-item {
    width: 100%;
    padding: 9px 11px;
    border: 0;
    border-bottom: 1px solid #edf0f3;
    background: #ffffff;
    text-align: left;
}

.autocomplete-item:last-child {
    border-bottom: 0;
}

.autocomplete-item:hover {
    background: var(--primary-soft);
}

.autocomplete-item-title {
    color: var(--text-dark);
    font-size: 12px;
    font-weight: 700;
}

.autocomplete-item-description {
    color: var(--text-muted);
    font-size: 10px;
    margin-top: 2px;
}

/* =========================================================
   52. FILE INPUT
   ========================================================= */

.file-input-wrapper {
    position: relative;
    width: 100%;
}

.file-input {
    width: 100%;
    padding: 9px;
    border: 1px dashed var(--border-dark);
    border-radius: 7px;
    background: var(--surface-soft);
    color: var(--text-muted);
    font-size: 12px;
}

.file-input:hover {
    border-color: var(--primary);
    background: var(--primary-soft);
}

/* =========================================================
   53. PRODUCT IMAGE
   ========================================================= */

.product-image {
    width: 42px;
    height: 42px;
    border-radius: 7px;
    object-fit: cover;
    background: var(--surface-dark);
    border: 1px solid var(--border);
}

.product-image-placeholder {
    width: 42px;
    height: 42px;
    border-radius: 7px;
    background: var(--surface-dark);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}

/* =========================================================
   54. INFO GRID
   ========================================================= */

.info-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.info-item {
    min-width: 0;
    padding: 11px 13px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
}

.info-item:nth-child(2n) {
    border-right: 0;
}

.info-item:nth-last-child(-n + 2) {
    border-bottom: 0;
}

.info-label {
    color: var(--text-muted);
    font-size: 10px;
    margin-bottom: 3px;
}

.info-value {
    color: var(--text-dark);
    font-size: 12px;
    font-weight: 700;
    word-break: break-word;
}

/* =========================================================
   55. TIMELINE
   ========================================================= */

.timeline {
    position: relative;
    padding-left: 24px;
}

.timeline::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 5px;
    bottom: 5px;
    width: 1px;
    background: var(--border);
}

.timeline-item {
    position: relative;
    padding-bottom: 18px;
}

.timeline-item:last-child {
    padding-bottom: 0;
}

.timeline-dot {
    position: absolute;
    left: -21px;
    top: 4px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--primary);
    border: 2px solid #ffffff;
    box-shadow: 0 0 0 1px var(--primary);
}

.timeline-title {
    color: var(--text-dark);
    font-size: 12px;
    font-weight: 700;
}

.timeline-text {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 2px;
}

.timeline-date {
    color: var(--text-light);
    font-size: 10px;
    margin-top: 3px;
}

/* =========================================================
   56. PROGRESS
   ========================================================= */

.progress {
    width: 100%;
    height: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: #e7ebef;
}

.progress-bar {
    height: 100%;
    border-radius: inherit;
    background: var(--primary);
    transition: width 0.3s ease;
}

.progress-bar.success {
    background: var(--success);
}

.progress-bar.warning {
    background: var(--warning);
}

.progress-bar.danger {
    background: var(--danger);
}

/* =========================================================
   57. QUICK ACTIONS
   ========================================================= */

.quick-actions {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
}

.quick-action {
    min-height: 88px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #ffffff;
    color: var(--text);
    text-align: center;
    transition:
        transform var(--transition-fast),
        box-shadow var(--transition-fast),
        border-color var(--transition-fast);
}

.quick-action:hover {
    transform: translateY(-2px);
    border-color: var(--primary);
    box-shadow: var(--shadow-sm);
}

.quick-action-icon {
    width: 35px;
    height: 35px;
    margin: 0 auto 7px;
    border-radius: 8px;
    background: var(--primary-soft);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
}

.quick-action-label {
    font-size: 10px;
    font-weight: 700;
}

/* =========================================================
   58. MOBILE QUICK ACTIONS
   ========================================================= */

@media (max-width: 768px) {
    .quick-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

/* =========================================================
   59. RECEIPT PREVIEW
   ========================================================= */

.receipt-preview {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    padding: 30px;
    background: #ffffff;
    color: #000000;
    border: 1px solid #dddddd;
}

.receipt-header {
    text-align: center;
    margin-bottom: 20px;
}

.receipt-shop-name {
    font-size: 20px;
    font-weight: 800;
}

.receipt-shop-detail {
    font-size: 11px;
    margin-top: 3px;
}

.receipt-meta {
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px 20px;
    font-size: 11px;
}

.receipt-table {
    width: 100%;
    margin-top: 18px;
}

.receipt-table th,
.receipt-table td {
    padding: 7px 5px;
    border-bottom: 1px solid #cccccc;
    font-size: 11px;
}

.receipt-table th {
    font-weight: 800;
    border-top: 1px solid #000000;
}

.receipt-total {
    width: 300px;
    max-width: 100%;
    margin-left: auto;
    margin-top: 15px;
}

.receipt-total-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 11px;
}

.receipt-total-row.final {
    border-top: 1px solid #000000;
    margin-top: 4px;
    padding-top: 8px;
    font-size: 15px;
    font-weight: 800;
}

/* =========================================================
   60. ERROR PAGE
   ========================================================= */

.error-page {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
}

.error-code {
    color: var(--primary);
    font-size: 64px;
    font-weight: 900;
    line-height: 1;
}

.error-title {
    color: var(--text-dark);
    font-size: 20px;
    font-weight: 800;
    margin-top: 12px;
}

.error-message {
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 5px;
    max-width: 450px;
}

/* =========================================================
   61. DATA LOADING SKELETON
   ========================================================= */

.skeleton {
    position: relative;
    overflow: hidden;
    background: #e9edf2;
    border-radius: 5px;
}

.skeleton::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.55),
        transparent
    );
    animation: skeleton-loading 1.4s infinite;
}

.skeleton-line {
    height: 12px;
    width: 100%;
    margin-bottom: 8px;
}

.skeleton-line.short {
    width: 45%;
}

.skeleton-line.medium {
    width: 70%;
}

@keyframes skeleton-loading {
    100% {
        left: 100%;
    }
}

/* =========================================================
   62. NAVIGATION MOBILE
   ========================================================= */

.mobile-menu-button {
    display: none;
}

@media (max-width: 992px) {
    .mobile-menu-button {
        display: flex;
    }
}

/* =========================================================
   63. BODY MODAL OPEN
   ========================================================= */

body.modal-open {
    overflow: hidden;
}

/* =========================================================
   64. CONFIRM DIALOG
   ========================================================= */

.confirm-dialog {
    text-align: center;
    padding: 10px 10px 4px;
}

.confirm-icon {
    width: 58px;
    height: 58px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--warning-light);
    color: var(--warning);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}

.confirm-title {
    color: var(--text-dark);
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 5px;
}

.confirm-message {
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.7;
}

/* =========================================================
   65. DASHBOARD WELCOME
   ========================================================= */

.welcome-banner {
    position: relative;
    overflow: hidden;
    padding: 22px;
    margin-bottom: 18px;
    border-radius: 10px;
    background: linear-gradient(
        135deg,
        var(--primary-dark),
        var(--primary)
    );
    color: #ffffff;
}

.welcome-banner::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    right: -50px;
    top: -60px;
    border-radius: 50%;
    border: 30px solid rgba(255, 255, 255, 0.06);
}

.welcome-title {
    position: relative;
    z-index: 1;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 3px;
}

.welcome-text {
    position: relative;
    z-index: 1;
    max-width: 650px;
    color: rgba(255, 255, 255, 0.72);
    font-size: 12px;
}

/* =========================================================
   66. ACCOUNTING JOURNAL
   ========================================================= */

.journal-debit {
    color: var(--success);
    font-weight: 700;
}

.journal-credit {
    color: var(--danger);
    font-weight: 700;
}

.journal-account {
    font-weight: 700;
    color: var(--text-dark);
}

.journal-description {
    color: var(--text-muted);
    font-size: 11px;
}

/* =========================================================
   67. MONEY INPUT
   ========================================================= */

.money-input {
    text-align: right;
    font-variant-numeric: tabular-nums;
}

/* =========================================================
   68. NUMBER INPUT
   ========================================================= */

.number-input {
    text-align: right;
    font-variant-numeric: tabular-nums;
}

/* =========================================================
   69. DATE INPUT
