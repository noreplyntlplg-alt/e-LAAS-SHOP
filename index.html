<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบบริหารการเงินและเอกสารกิจการ</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand-mark">ก</div>
    <h1>ระบบบริหารการเงินและเอกสารกิจการ</h1>
    <p>Finance & Document Management System</p>
    <form id="loginForm">
      <div class="form-group"><label>ชื่อผู้ใช้งาน</label><input id="loginUsername" required autocomplete="username"></div>
      <div class="form-group"><label>รหัสผ่าน</label><input id="loginPassword" type="password" required autocomplete="current-password"></div>
      <button class="btn primary wide" type="submit">เข้าสู่ระบบ</button>
    </form>
    <div class="login-foot">ระบบเชื่อมต่อฐานข้อมูล Google Sheets</div>
  </div>
</div>

<div id="app" class="hidden">
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark small">ก</div>
    <div><strong id="businessName">ระบบการเงิน</strong><small>Finance & Documents</small></div>
  </div>
  <nav>
    <div class="nav-section">หน้าหลัก</div>
    <button class="nav-item active" data-page="dashboard">▣ <span>แดชบอร์ด</span></button>
    <div class="nav-section">การเงิน</div>
    <button class="nav-item" data-page="income">＋ <span>รายรับ</span></button>
    <button class="nav-item" data-page="expense">－ <span>รายจ่าย</span></button>
    <button class="nav-item" data-page="transfer">⇄ <span>โอนเงิน</span></button>
    <button class="nav-item" data-page="accounts">฿ <span>เงินสด / ธนาคาร</span></button>
    <div class="nav-section">เอกสาร</div>
    <button class="nav-item" data-page="documents">▤ <span>ทะเบียนเอกสาร</span></button>
    <button class="nav-item" data-page="customers">♙ <span>ลูกค้า</span></button>
    <button class="nav-item" data-page="suppliers">♧ <span>ผู้จำหน่าย / เจ้าหนี้</span></button>
    <div class="nav-section">รายงาน</div>
    <button class="nav-item" data-page="reports">▥ <span>รายงานการเงิน</span></button>
    <div class="nav-section">ระบบ</div>
    <button class="nav-item" data-page="users">♙ <span>ผู้ใช้งาน</span></button>
    <button class="nav-item" data-page="settings">⚙ <span>ตั้งค่าระบบ</span></button>
  </nav>
  <div class="sidebar-bottom">
    <div id="userInfo"></div>
    <button id="logoutBtn" class="btn outline wide">ออกจากระบบ</button>
  </div>
</aside>

<main class="main">
<header class="topbar">
  <button id="menuBtn" class="icon-btn">☰</button>
  <div><div id="pageTitle" class="page-title">แดชบอร์ด</div><div id="breadcrumb" class="breadcrumb">หน้าหลัก</div></div>
  <div class="top-actions">
    <button id="refreshBtn" class="btn outline">รีเฟรช</button>
    <span id="status" class="status-pill">พร้อมใช้งาน</span>
  </div>
</header>
<section id="content" class="content"></section>
</main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-box">
    <div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" class="icon-btn">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
